[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dualverify-sentinel"
version = "0.1.0"
description = "Authorization-gated local security checks for lab targets and explicitly authorized hosts"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "vuln-hunter contributors" }]
dependencies = []  # standard library only; nuclei/bandit are optional external binaries

[project.scripts]
dvs = "vuln_hunter.__main__:main"

[tool.setuptools]
packages = ["vuln_hunter"]
