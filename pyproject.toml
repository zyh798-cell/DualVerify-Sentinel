[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dualverify-sentinel"
version = "0.2.0rc1"
description = "Authorization-gated local security checks for lab targets and explicitly authorized hosts"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "vuln-hunter contributors" }]
dependencies = []  # standard library only; nuclei/bandit are optional external binaries

[project.scripts]
dvs = "vuln_hunter.__main__:main"

[tool.setuptools]
# adapters_ext is a first-class subpackage (EXT-1): the gitleaks adapter must
# ship in the wheel/sdist, not just be importable from a source checkout.
packages = ["vuln_hunter", "vuln_hunter.adapters_ext"]
