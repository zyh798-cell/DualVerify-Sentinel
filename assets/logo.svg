<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 648" width="640" height="648" role="img">
  <title>DualVerify-Sentinel logo</title>
  <desc>Fused DualVerify-Sentinel mark: a deep navy shield with volumetric shading, two interlocking teal and blue bands entering from the upper left, a dual verification check inside the shield, a cyan orbit with a node at each end, and the DVS wordmark below with two checks inside the counter of the D.</desc>
