      <stop offset="0" stop-color="#053478"/>
      <stop offset="0.5" stop-color="#032A5B"/>
      <stop offset="1" stop-color="#021A34"/>
    </linearGradient>
    <linearGradient id="dvsWordmark" x1="0" y1="592" x2="0" y2="792" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C3361"/>
      <stop offset="1" stop-color="#05244B"/>
    </linearGradient>
    <linearGradient id="dvsOrbitNode" x1="0" y1="180" x2="0" y2="532" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#23DDED"/>
      <stop offset="1" stop-color="#21BAF7"/>
    </linearGradient>
    <clipPath id="dvsShieldClip"><path d="M374 295A158.6 158.6 0 0 1 641 295V350C641 432 575 486 507.5 514C440 486 374 432 374 350Z"/></clipPath>
  </defs>
